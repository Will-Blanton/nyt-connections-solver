[tool.poetry]
name = "nyt-connections-solver"
version = "0.1.0"
description = "A machine learning agent for NYT Connections."
authors = ["Will Blanton"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
pandas = ">=2.3.0,<3.0.0a"
scikit-learn = ">=1.7.0,<2.0.0"
gensim = ">=4.3.3,<5.0.0"
jupyter = ">=1.1.1,<2.0.0"
notebook = ">=7.4.4,<8.0.0"
sentence-transformers = ">=5.1.1,<6.0.0"

pytorchltr = "0.1.0"
tensorboardx = "^2.6.4"
selenium = "^4.36.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# Make the default index explicit (prevents edge cases once you add custom sources)
[[tool.poetry.source]]
name = "pypi"
priority = "primary"

# CUDA wheels source (used only if you enable the cuda group)
[[tool.poetry.source]]
name = "pytorch_cuda"
url = "https://download.pytorch.org/whl/cu128"
priority = "explicit"

# ---- Optional dependency groups for different machines ----
[tool.poetry.group.cuda]
optional = true

[tool.poetry.group.cuda.dependencies]
# Strong recommendation: pin exact versions while you stabilize the lock
torch = { version = "2.7.1", source = "pytorch_cuda" }
torchvision = { version = "0.22.1", source = "pytorch_cuda" }
torchaudio = { version = "2.7.1", source = "pytorch_cuda" }

# Optional example if you want a CPU-only group (kept commented unless you need it)
# [tool.poetry.group.cpu]
# optional = true
#
# [tool.poetry.group.cpu.dependencies]
# torch = "2.7.1"
# torchvision = "0.22.1"
# torchaudio = "2.7.1"

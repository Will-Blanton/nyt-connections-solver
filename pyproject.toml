[project]
name = "nyt-connections-solver"
version = "0.1.0"
description = "A machine learning agent for NYT Connections."
authors = [{ name = "Will Blanton" }]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "gensim>=4.3.3,<5.0.0",
    "jupyter>=1.1.1,<2.0.0",
    "notebook>=7.4.4,<8.0.0",
    "optuna>=5.0.0",
    "pandas>=2.3.0,<3.0.0a",
    "pytorchltr==0.1.0",
    "scikit-learn>=1.7.0,<2.0.0",
    "selenium>=4.36.0,<5.0.0",
    "sentence-transformers>=5.1.1,<6.0.0",
    "tensorboardx>=2.6.4,<3.0.0",
    "torch==2.7.1",
    "torchaudio==2.7.1",
    "torchvision==0.22.1",
]

[tool.uv]
# This is an application/notebook project; src is added to sys.path by the notebook.
package = false

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cuda" }
torchaudio = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }
